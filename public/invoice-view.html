<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Invoice - RenewDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/sidebar.js"></script>
    <link rel="stylesheet" href="assets/css/v2.css">
    <style>
        .rd-inv { max-width: 820px; margin: 0 auto; background: #fff; color: #222; font-family: 'IBM Plex Sans', sans-serif; }
        .rd-inv-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1f3864; padding-bottom: 18px; margin-bottom: 24px; }
        .rd-inv-logo img { max-height: 56px; max-width: 190px; object-fit: contain; }
        .rd-inv-biz-name { font-size: 20px; font-weight: 700; color: #1f3864; margin: 0 0 4px; }
        .rd-inv-biz-meta { font-size: 12px; color: #6b6b6b; line-height: 1.6; }
        .rd-inv-title { text-align: right; font-size: 28px; font-weight: 700; color: #1f3864; letter-spacing: .04em; margin: 0 0 6px; }
        .rd-inv-meta { text-align: right; font-size: 12.5px; color: #333; line-height: 1.8; }
        .rd-inv-meta b { color: #1f3864; }
        .rd-inv-billto { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #0f6e6e; margin: 0 0 6px; }
        .rd-inv-client { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 2px; }
        .rd-inv-client-meta { font-size: 12.5px; color: #6b6b6b; }
        .rd-inv-table { width: 100%; border-collapse: collapse; margin: 26px 0 4px; }
        .rd-inv-table th { background: #1f3864; color: #fff; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 9px 12px; }
        .rd-inv-table th.num, .rd-inv-table td.num { text-align: right; }
        .rd-inv-table td { border-bottom: 1px solid #e2e5e9; padding: 10px 12px; font-size: 13px; color: #333; }
        .rd-inv-totals { width: 280px; margin-left: auto; margin-top: 10px; }
        .rd-inv-totals div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
        .rd-inv-totals .grand { border-top: 2px solid #1f3864; font-size: 17px; font-weight: 700; color: #1f3864; margin-top: 4px; padding-top: 10px; }
        .rd-inv-payment { margin-top: 34px; padding: 16px 20px; background: #f6f7f9; border-radius: 8px; }
        .rd-inv-payment-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #1f3864; margin: 0 0 8px; }
        .rd-inv-payment-row { font-size: 12.5px; color: #444; margin-bottom: 3px; }
        .rd-inv-sign { display: flex; justify-content: flex-end; margin-top: 50px; }
        .rd-inv-sign-box { text-align: center; }
        .rd-inv-sign-line { border-top: 1px solid #999; padding-top: 6px; font-size: 12px; color: #444; min-width: 180px; }
        .rd-inv-thanks { text-align: center; margin-top: 40px; font-size: 13px; font-style: italic; color: #6b6b6b; }
        @media print { .rd-inv-payment { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } .rd-inv-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    </style>
</head>
<body class="rd-body">
<div class="rd-layout">

    <!-- SIDEBAR -->
    <aside class="rd-sidebar rd-no-print" id="rd-sidebar"></aside>
    <script>rdSidebar.init('invoices');</script>

    <!-- MAIN -->
    <div class="rd-main">
        <div class="rd-page-header rd-no-print" style="align-items:center">
            <div style="display:flex;align-items:center;gap:14px">
                <a href="invoices.html" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);text-decoration:none;flex-shrink:0">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div><h1 class="rd-page-title">Invoice</h1><p class="rd-page-subtitle" id="invSubtitle">Printable view</p></div>
            </div>
            <div style="display:flex;gap:10px;margin-left:auto">
                <button id="markSentBtn" class="rd-btn">Mark Sent</button>
                <button id="markPaidBtn" class="rd-btn" style="color:var(--good);border-color:var(--good)">Mark Paid</button>
                <button onclick="window.print()" class="rd-btn rd-btn-primary">Print / Save as PDF</button>
            </div>
        </div>

        <div class="rd-card rd-inv" style="padding:40px 46px">
            <div class="rd-inv-head">
                <div class="rd-inv-logo">
                    <div id="bizLogoWrap"></div>
                    <div class="rd-inv-biz-name" id="bizName">Business Name</div>
                    <div class="rd-inv-biz-meta" id="bizMeta"></div>
                </div>
                <div>
                    <div class="rd-inv-title">INVOICE</div>
                    <div class="rd-inv-meta" id="invMeta"></div>
                </div>
            </div>

            <div>
                <div class="rd-inv-billto">Invoice To</div>
                <div class="rd-inv-client" id="clientName"></div>
                <div class="rd-inv-client-meta" id="clientMeta"></div>
            </div>

            <table class="rd-inv-table">
                <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead>
                <tbody id="itemsBody"></tbody>
            </table>

            <div class="rd-inv-totals">
                <div><span>Subtotal</span><span id="tSubtotal"></span></div>
                <div><span>Discount</span><span id="tDiscount"></span></div>
                <div class="grand"><span>Grand Total</span><span id="tGrand"></span></div>
            </div>

            <div class="rd-inv-payment" id="paymentBlock"></div>

            <div class="rd-inv-sign">
                <div class="rd-inv-sign-box">
                    <div class="rd-inv-sign-line" id="signatoryName">Authorized Signatory</div>
                </div>
            </div>

            <p class="rd-inv-thanks">Thank you for your business!</p>
        </div>
    </div>
</div>

<script src="assets/js/rd-api.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const invoiceId = urlParams.get('id');
const fmt = (v) => new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(parseFloat(v)||0);
let currentInvoice = null;

async function loadSettingsMap() {
    const res = await fetch(rdApi('api/settings.php'), { credentials: 'same-origin' });
    const data = await res.json();
    const map = {};
    (data.data || []).forEach(s => map[s.key] = s.value);
    return map;
}

function renderBusiness(map) {
    document.getElementById('bizName').textContent = map.biz_name || 'Your Business Name';
    const metaParts = [map.biz_address, map.biz_phone, map.biz_email, map.biz_website].filter(Boolean);
    document.getElementById('bizMeta').innerHTML = metaParts.join('<br>');
    if (map.biz_logo_url) {
        document.getElementById('bizLogoWrap').innerHTML = `<img src="${map.biz_logo_url}" alt="Logo">`;
    }
    document.getElementById('signatoryName').textContent = map.signatory_name || 'Authorized Signatory';

    const payRows = [];
    if (map.bank_name) payRows.push(`<div class="rd-inv-payment-row"><b>Bank:</b> ${map.bank_name}</div>`);
    if (map.bank_account) payRows.push(`<div class="rd-inv-payment-row"><b>Account #:</b> ${map.bank_account}</div>`);
    if (map.bank_ifsc) payRows.push(`<div class="rd-inv-payment-row"><b>IFSC:</b> ${map.bank_ifsc}</div>`);
    if (map.upi_id) payRows.push(`<div class="rd-inv-payment-row"><b>UPI:</b> ${map.upi_id}</div>`);
    if (map.gpay_number) payRows.push(`<div class="rd-inv-payment-row"><b>GPay:</b> ${map.gpay_number}</div>`);
    document.getElementById('paymentBlock').innerHTML = payRows.length
        ? `<div class="rd-inv-payment-title">Payment Details</div>${payRows.join('')}`
        : '';
}

function renderInvoice(inv) {
    currentInvoice = inv;
    document.getElementById('invSubtitle').textContent = inv.invoice_number;
    document.getElementById('invMeta').innerHTML = `
        <div><b>Invoice #:</b> ${inv.invoice_number}</div>
        <div><b>Date:</b> ${rdFormatDate(inv.invoice_date)}</div>
        ${inv.due_date ? `<div><b>Due:</b> ${rdFormatDate(inv.due_date)}</div>` : ''}
    `;
    document.getElementById('clientName').textContent = inv.client_name + (inv.client_company ? ' — ' + inv.client_company : '');
    document.getElementById('clientMeta').innerHTML = [inv.client_email, inv.project_name ? 'Project: ' + inv.project_name : ''].filter(Boolean).join('<br>');

    document.getElementById('itemsBody').innerHTML = (inv.items || []).map(it => `
        <tr>
            <td>${it.description}</td>
            <td class="num">${it.qty}</td>
            <td class="num">₹${fmt(it.price)}</td>
            <td class="num">₹${fmt(it.total)}</td>
        </tr>`).join('');

    document.getElementById('tSubtotal').textContent = '₹' + fmt(inv.subtotal);
    document.getElementById('tDiscount').textContent = '₹' + fmt(inv.discount);
    document.getElementById('tGrand').textContent = '₹' + fmt(inv.grand_total);

    document.getElementById('markPaidBtn').style.display = inv.status === 'paid' ? 'none' : '';
    document.getElementById('markSentBtn').style.display = inv.status === 'draft' ? '' : 'none';
}

async function setStatus(status) {
    await fetch(rdApi(`api/invoices.php?id=${invoiceId}`), { method: 'PUT', headers: {'Content-Type':'application/json'}, credentials: 'same-origin', body: JSON.stringify({ status }) });
    load();
}
document.getElementById('markSentBtn').addEventListener('click', () => setStatus('sent'));
document.getElementById('markPaidBtn').addEventListener('click', async () => {
    const result = await Swal.fire({ title: 'Mark as Paid?', text: 'This will also mark linked domains/hosting/AMC as paid.', icon: 'question', showCancelButton: true, confirmButtonColor: '#0f9d76', confirmButtonText: 'Yes, Mark Paid' });
    if (!result.isConfirmed) return;
    setStatus('paid');
});

async function load() {
    if (!invoiceId) return;
    const res = await fetch(rdApi(`api/invoices.php?id=${invoiceId}`), { credentials: 'same-origin' });
    if (res.status === 401) { window.location.href = 'login.html'; return; }
    const [map, data] = await Promise.all([loadSettingsMap(), res.json()]);
    if (data.status !== 'success') { rdError('Invoice not found.'); return; }
    renderBusiness(map);
    renderInvoice(data.data);
}
load();
</script>
</body>
</html>
