<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>New Invoice - RenewDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <link rel="stylesheet" href="assets/css/v2.css">
    <style>
        .ts-wrapper.single .ts-control { background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--text);box-shadow:none;cursor:pointer;min-height:0 }
        .ts-wrapper.single.input-active .ts-control { border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,118,.15) }
        .ts-dropdown { border:1px solid var(--border-2);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);background:var(--surface);font-family:inherit;font-size:14px;margin-top:4px }
        .ts-dropdown .option { padding:10px 14px;color:var(--text) }
        .ts-dropdown .option:hover,.ts-dropdown .option.active { background:var(--accent-soft);color:var(--accent) }
        .ts-dropdown .option.selected { background:var(--accent-soft);color:var(--accent);font-weight:600 }
        .ts-dropdown-content { max-height:240px }
        .ts-dropdown-flip { top:auto !important; bottom:100%; margin-top:0; margin-bottom:4px }
    </style>
</head>
<body class="rd-body">
<div class="rd-layout">

    <!-- SIDEBAR -->
    <aside class="rd-sidebar" id="rd-sidebar"></aside>
    <script>rdSidebar.init('invoices');</script>

    <!-- MAIN -->
    <div class="rd-main">
        <div class="rd-page-header" style="align-items:center">
            <div style="display:flex;align-items:center;gap:14px">
                <a href="invoices.html" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);text-decoration:none;flex-shrink:0" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-2)'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div><h1 class="rd-page-title" id="pageTitle">New Invoice</h1><p class="rd-page-subtitle">Bill a client for renewals or an AMC contract</p></div>
            </div>
            <div style="display:flex;gap:10px;margin-left:auto">
                <a href="invoices.html" class="rd-btn">Cancel</a>
                <button id="saveInvoiceBtn" class="rd-btn rd-btn-primary">Save Invoice</button>
            </div>
        </div>

        <div class="rd-card" style="max-width:900px;padding:26px">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                <div class="rd-form-group"><label class="rd-label">Client <span style="color:var(--bad)">*</span></label><select id="inv_client" class="rd-input"><option value="">— Select client —</option></select></div>
                <div class="rd-form-group"><label class="rd-label">Project</label><select id="inv_project" class="rd-input"><option value="">— None —</option></select></div>
                <div class="rd-form-group"><label class="rd-label">Invoice Date</label><input type="date" id="inv_date" class="rd-input"></div>
                <div class="rd-form-group"><label class="rd-label">Due Date</label><input type="date" id="inv_due" class="rd-input"></div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px">
                <label class="rd-label" style="margin:0">Line Items</label>
                <div style="display:flex;gap:8px">
                    <button type="button" id="loadUnpaidBtn" class="rd-btn" style="font-size:12.5px;padding:6px 12px">Load Unpaid Items</button>
                    <button type="button" id="addRowBtn" class="rd-btn" style="font-size:12.5px;padding:6px 12px">+ Add Row</button>
                </div>
            </div>
            <div style="border:1px solid var(--border);border-radius:12px;overflow:hidden">
                <table style="width:100%;border-collapse:collapse">
                    <thead><tr style="background:var(--surface-2)">
                        <th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-3);text-transform:uppercase">Description</th>
                        <th style="padding:8px 12px;text-align:center;font-size:11px;color:var(--text-3);text-transform:uppercase;width:70px">Qty</th>
                        <th style="padding:8px 12px;text-align:right;font-size:11px;color:var(--text-3);text-transform:uppercase;width:110px">Price</th>
                        <th style="padding:8px 12px;text-align:right;font-size:11px;color:var(--text-3);text-transform:uppercase;width:110px">Total</th>
                        <th style="width:36px"></th>
                    </tr></thead>
                    <tbody id="itemRows"></tbody>
                </table>
            </div>

            <div style="display:flex;justify-content:flex-end;margin-top:16px">
                <div style="width:280px;display:flex;flex-direction:column;gap:8px">
                    <div style="display:flex;justify-content:space-between;font-size:13.5px"><span style="color:var(--text-3)">Subtotal</span><span id="sumSubtotal" style="font-weight:600;font-family:'IBM Plex Mono',monospace">₹0.00</span></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px"><span style="color:var(--text-3)">Discount</span><input type="number" step="0.01" id="inv_discount" class="rd-input" style="width:130px;text-align:right" value="0"></div>
                    <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;border-top:1px solid var(--border);padding-top:8px"><span>Grand Total</span><span id="sumTotal" style="font-family:'IBM Plex Mono',monospace">₹0.00</span></div>
                </div>
            </div>
            <div class="rd-form-group" style="margin-top:14px"><label class="rd-label">Notes</label><textarea id="inv_notes" rows="3" class="rd-input" style="resize:vertical"></textarea></div>
        </div>
    </div>
</div>

<script src="assets/js/rd-api.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const editId = urlParams.get('id');
const preselectProjectId = urlParams.get('project_id');
let itemsState = [];
const fmt = (v) => new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(parseFloat(v)||0);

let tsInvClient = null;
let tsInvProject = null;

function initTomSelects() {
    tsInvClient = new TomSelect('#inv_client', {
        placeholder: '— Select client —', allowEmptyOption: true, maxOptions: 300, searchField: ['text'],
        onDropdownOpen: function () { rdAutoFlipDropdown(this); },
        onChange: (clientId) => loadProjectsForClient(clientId)
    });
    tsInvProject = new TomSelect('#inv_project', {
        placeholder: '— None —', allowEmptyOption: true, maxOptions: 300, searchField: ['text'],
        onDropdownOpen: function () { rdAutoFlipDropdown(this); }
    });
}

async function loadClients() {
    const res = await fetch(rdApi('api/clients.php'), { credentials: 'same-origin' });
    if (res.status === 401) { window.location.href = 'login.html'; return; }
    const data = await res.json();
    tsInvClient.clearOptions();
    tsInvClient.addOption({ value: '', text: '— Select client —' });
    (data.data || []).forEach(c => tsInvClient.addOption({ value: c.id, text: c.name + (c.company ? ' — ' + c.company : '') }));
    tsInvClient.refreshOptions(false);
}

async function loadProjectsForClient(clientId, selectedProjectId) {
    tsInvProject.clearOptions();
    tsInvProject.addOption({ value: '', text: '— None —' });
    tsInvProject.setValue('');
    if (!clientId) { tsInvProject.refreshOptions(false); return; }
    const res = await fetch(rdApi(`api/projects.php?client_id=${clientId}`), { credentials: 'same-origin' });
    const data = await res.json();
    (data.data || []).forEach(p => tsInvProject.addOption({ value: p.id, text: p.name }));
    tsInvProject.refreshOptions(false);
    if (selectedProjectId) tsInvProject.setValue(String(selectedProjectId));
}

function renderItemRows() {
    document.getElementById('itemRows').innerHTML = itemsState.map((it, i) => `
        <tr>
            <td style="padding:6px 12px"><input type="text" class="rd-input item-desc" data-i="${i}" value="${(it.description||'').replace(/"/g,'&quot;')}" style="border:none;background:transparent;padding:4px"></td>
            <td style="padding:6px 12px"><input type="number" step="0.01" class="rd-input item-qty" data-i="${i}" value="${it.qty}" style="border:none;background:transparent;padding:4px;text-align:center;width:100%"></td>
            <td style="padding:6px 12px"><input type="number" step="0.01" class="rd-input item-price" data-i="${i}" value="${it.price}" style="border:none;background:transparent;padding:4px;text-align:right;width:100%"></td>
            <td style="padding:6px 12px;text-align:right;font-family:'IBM Plex Mono',monospace">₹${fmt(it.qty * it.price)}</td>
            <td style="text-align:center"><button type="button" onclick="removeRow(${i})" class="rd-icon-btn danger" style="width:26px;height:26px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></td>
        </tr>`).join('');
    recomputeTotals();
}

function removeRow(i) { itemsState.splice(i, 1); renderItemRows(); }

document.getElementById('itemRows').addEventListener('input', (e) => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    if (e.target.classList.contains('item-desc')) itemsState[i].description = e.target.value;
    if (e.target.classList.contains('item-qty')) itemsState[i].qty = parseFloat(e.target.value) || 0;
    if (e.target.classList.contains('item-price')) itemsState[i].price = parseFloat(e.target.value) || 0;
    recomputeTotals();
    const row = e.target.closest('tr');
    if (row) row.children[3].textContent = '₹' + fmt(itemsState[i].qty * itemsState[i].price);
});

function recomputeTotals() {
    const subtotal = itemsState.reduce((s, it) => s + (it.qty * it.price), 0);
    const discount = parseFloat(document.getElementById('inv_discount').value) || 0;
    document.getElementById('sumSubtotal').textContent = '₹' + fmt(subtotal);
    document.getElementById('sumTotal').textContent = '₹' + fmt(Math.max(0, subtotal - discount));
}
document.getElementById('inv_discount').addEventListener('input', recomputeTotals);

document.getElementById('addRowBtn').addEventListener('click', () => {
    itemsState.push({ description: '', qty: 1, price: 0, source_type: 'manual', source_id: null });
    renderItemRows();
});

document.getElementById('loadUnpaidBtn').addEventListener('click', async () => {
    const projectId = tsInvProject.getValue();
    if (!projectId) { Swal.fire('Select a project first', 'Unpaid items are pulled per project.', 'info'); return; }
    const res = await fetch(rdApi(`api/invoices.php?unpaid_for=${projectId}`), { credentials: 'same-origin' });
    const data = await res.json();
    (data.data || []).forEach(it => itemsState.push(it));
    renderItemRows();
});

document.getElementById('saveInvoiceBtn').addEventListener('click', async () => {
    const clientId = tsInvClient.getValue();
    if (!clientId) { Swal.fire('Client required', 'Please select a client.', 'warning'); return; }
    if (itemsState.length === 0) { Swal.fire('No items', 'Add at least one line item.', 'warning'); return; }

    const btn = document.getElementById('saveInvoiceBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
        const payload = {
            client_id: clientId,
            project_id: tsInvProject.getValue() || null,
            invoice_date: document.getElementById('inv_date').value,
            due_date: document.getElementById('inv_due').value || null,
            discount: parseFloat(document.getElementById('inv_discount').value) || 0,
            notes: document.getElementById('inv_notes').value,
            items: itemsState
        };
        const url = editId ? rdApi(`api/invoices.php?id=${editId}`) : rdApi('api/invoices.php');
        const res = await fetch(url, { method: editId ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, credentials: 'same-origin', body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.message || 'Failed to save invoice');
        window.location.href = `invoice-view.html?id=${editId || data.id}`;
    } catch(e) {
        Swal.fire('Error', e.message || 'Failed to save invoice.', 'error');
        btn.disabled = false; btn.textContent = 'Save Invoice';
    }
});

async function init() {
    initTomSelects();
    await loadClients();
    document.getElementById('inv_date').value = new Date().toISOString().split('T')[0];

    if (editId) {
        document.getElementById('pageTitle').textContent = 'Edit Invoice';
        document.title = 'Edit Invoice - RenewDesk';
        const res = await fetch(rdApi(`api/invoices.php?id=${editId}`), { credentials: 'same-origin' });
        const data = await res.json();
        if (data.status === 'success') {
            const inv = data.data;
            tsInvClient.setValue(String(inv.client_id), true);
            await loadProjectsForClient(inv.client_id, inv.project_id);
            document.getElementById('inv_date').value = inv.invoice_date;
            document.getElementById('inv_due').value = inv.due_date || '';
            document.getElementById('inv_discount').value = inv.discount;
            document.getElementById('inv_notes').value = inv.notes || '';
            itemsState = (inv.items || []).map(it => ({ description: it.description, qty: parseFloat(it.qty), price: parseFloat(it.price), source_type: it.source_type, source_id: it.source_id }));
            renderItemRows();
        }
    } else if (preselectProjectId) {
        const res = await fetch(rdApi(`api/projects.php?id=${preselectProjectId}`), { credentials: 'same-origin' });
        const data = await res.json();
        if (data.status === 'success' && data.data.client_id) {
            tsInvClient.setValue(String(data.data.client_id), true);
            await loadProjectsForClient(data.data.client_id, preselectProjectId);
        }
        renderItemRows();
    } else {
        renderItemRows();
    }
}
init();
</script>
</body>
</html>
